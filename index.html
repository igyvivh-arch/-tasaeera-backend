    const sendWhatsApp = (message) => {
      const phone = window.ANNE_DATA.whatsapp.replace(/[^0-9]/g, '');
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    };

    // Logo Component (using the uploaded image)
    // =========================================================

      const h = heights[size] || 42;
      const [imgFailed, setImgFailed] = React.useState(false);

      return (
        <div className="flex items-center gap-2 select-none">
          {!imgFailed ? (
            <img
              src="logo.png"
              alt="Anne Cup Box Logo"
              style={{
                height: h,
                width: 'auto',
                objectFit: 'contain',
                filter: dark ? 'brightness(0) invert(1)' : 'none',
              }}
              onError={() => setImgFailed(true)}
            />
          ) : (
            /* Fallback SVG-style logo when image not found */
            <div
              style={{
                height: h,
                width: h,
                background: 'linear-gradient(135deg, #E75480, #D4AF37)',

                  ←

    // =========================================================
    // ORDER FLOW - Step 2: اختيار الأقسام

    const CategorySelectionStep = ({ selectedBox, cart, onSelectCategory, onBack }) => {
      const categories = window.ANNE_DATA.categories;
      const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);

      return (
        <div className="animate-slide-up">
          {/* رأس الصفحة */}
          <div className="flex items-center gap-3 mb-6">

              onClick={onBack}
              className="w-10 h-10 rounded-full border-2 border-pink-200 flex items-center justify-center text-pink-500 hover:bg-pink-50 transition-colors"

          <div className="space-y-3 max-w-2xl mx-auto">

            </div>
          )}

      );

    // =========================================================
    // ORDER FLOW - Step 3: اختيار المنتجات
    // =========================================================
    const ProductSelectionStep = ({ category, cart, onUpdateCart, onBack }) => {
      const addProduct = (product) => {
        onUpdateCart(prev => {
          const existing = prev.find(i => i.id === product.id);
          if (existing) {
            return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...product, categoryId: category.id, categoryName: category.name, qty: 1 }];
        });
      };

      const removeOne = (productId) => {
        onUpdateCart(prev => {
          const existing = prev.find(i => i.id === productId);
          if (!existing) return prev;
          if (existing.qty <= 1) return prev.filter(i => i.id !== productId);
          return prev.map(i => i.id === productId ? { ...i, qty: i.qty - 1 } : i);
        });
      };

      const deleteProduct = (productId) => {
        onUpdateCart(prev => prev.filter(i => i.id !== productId));
      };

      const getQty = (productId) => {
        const item = cart.find(i => i.id === productId);
        return item ? item.qty : 0;
      };

      return (
        <div className="animate-slide-up">
          <div className="flex items-center gap-3 mb-6">
            <button
              onClick={onBack}
              className="w-10 h-10 rounded-full border-2 border-pink-200 flex items-center justify-center text-pink-500 hover:bg-pink-50 transition-colors"
            >
              →
            </button>
            <div>
              <h2 className="text-2xl font-black text-gray-800" style={{ fontFamily: 'Cairo' }}>
                {category.icon} {category.name}

              <p className="text-sm text-gray-500" style={{ fontFamily: 'Tajawal' }}>{category.desc}</p>
            </div>
          </div>

          <div className="space-y-3 max-w-2xl mx-auto">
            {category.products.map((product) => {
              const qty = getQty(product.id);
              return (
                <div
                  key={product.id}
                  className={`flex items-center gap-4 bg-white rounded-2xl p-4 border-2 transition-all ${qty > 0 ? 'border-pink-400 shadow-md' : 'border-pink-100'}`}
                >
                  {/* أيقونة صغيرة */}
                  <div
                    className="w-14 h-14 rounded-xl flex items-center justify-center text-3xl flex-shrink-0"
                    style={{ background: 'linear-gradient(135deg, #FFE4EC, #F8C8DC)' }}
                  >
                    {product.emoji}
                  </div>

                  {/* بيانات المنتج */}
                  <div className="flex-1 min-w-0">
                    <div className="font-bold text-gray-800 text-sm" style={{ fontFamily: 'Cairo' }}>{product.name}</div>
                    <div className="text-pink-600 font-black text-base" style={{ fontFamily: 'Cairo' }}>
                      {product.price} <span className="text-xs font-normal text-gray-500">د.ج</span>
                    </div>
                  </div>

                  {/* أزرار التحكم */}
                  <div className="flex items-center gap-2 flex-shrink-0">
                    {qty > 0 ? (
                      <>
                        <button
                          onClick={() => deleteProduct(product.id)}
                          className="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center text-lg font-bold transition-colors"
                          title="حذف"
                        >
                          🗑
                        </button>
                        <button
                          onClick={() => removeOne(product.id)}
                          className="w-8 h-8 rounded-full bg-pink-100 text-pink-600 hover:bg-pink-200 flex items-center justify-center text-xl font-bold transition-colors"
                        >
                          −
                        </button>
                        <span className="w-7 text-center font-black text-gray-800" style={{ fontFamily: 'Cairo' }}>{qty}</span>
                        <button
                          onClick={() => addProduct(product)}
                          className="w-8 h-8 rounded-full text-white flex items-center justify-center text-xl font-bold hover:opacity-90 transition-opacity"
                          style={{ background: 'linear-gradient(135deg, #E75480, #D4AF37)' }}
                        >
                          +
                        </button>
                      </>
                    ) : (
                      <button
                        onClick={() => addProduct(product)}
                        className="w-10 h-10 rounded-full text-white flex items-center justify-center text-2xl font-bold hover:scale-110 transition-transform shadow-md"
                        style={{ background: 'linear-gradient(135deg, #E75480, #D4AF37)' }}

    // =========================================================

      return (
        <div className="animate-slide-up max-w-2xl mx-auto">

                    <div className="mt-1 text-xs text-gray-500 bg-pink-50 rounded-xl p-3" style={{ fontFamily: 'Tajawal' }}>
                      "{cardInfo.message}"

            {/* الإجمالي */}
            <div className="pt-2">
              <div className="flex justify-between text-sm text-gray-600 mb-1">
                <span style={{ fontFamily: 'Tajawal' }}>سعر البوكس</span>
                <span style={{ fontFamily: 'Cairo' }}>{boxPrice} د.ج</span>

                        activeCat === 'all' ? 'text-white shadow' : 'bg-white border border-pink-100 text-gray-600'
                      }`}
                      style={{ background: activeCat === 'all' ? 'linear-gradient(135deg, #E75480, #D4AF37)' : undefined, fontFamily: 'Cairo' }}
                    >
                      🛍️ الكل ({allProducts.length})
                    </button>
                    {categories.map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => setActiveCat(cat.id)}
                        className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all ${
                          activeCat === cat.id ? 'text-white shadow' : 'bg-white border border-pink-100 text-gray-600'
                        }`}
                        style={{ background: activeCat === cat.id ? 'linear-gradient(135deg, #E75480, #D4AF37)' : undefined, fontFamily: 'Cairo' }}
                      >
                        {cat.icon} {cat.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* رأس القسم النشط */}
                {activeCat !== 'all' && (() => {
                  const cat = categories.find(c => c.id === activeCat);
                  const idx = categories.findIndex(c => c.id === activeCat);
                  return cat ? (
                    <div
                      className="rounded-2xl p-5 mb-6 flex items-center gap-4 animate-fade-in"
                      style={{ background: catGradients[idx % catGradients.length] }}
                    >
                      <span className="text-5xl">{cat.icon}</span>
                      <div>
                        <h2 className="text-xl font-black text-gray-800" style={{ fontFamily: 'Cairo' }}>{cat.name}</h2>
                        <p className="text-sm text-gray-600" style={{ fontFamily: 'Tajawal' }}>{cat.desc} — {cat.products.length} منتج</p>
                      </div>
                    </div>
                  ) : null;
                })()}

                {/* عداد النتائج */}
                <div className="flex items-center justify-between mb-4">
                  <span className="text-sm text-gray-500" style={{ fontFamily: 'Tajawal' }}>
                    عرض <span className="font-bold text-pink-600">{filtered.length}</span> منتج
                    {search && <span> لـ "<strong>{search}</strong>"</span>}
                  </span>
                  {search && (
                    <button
                      onClick={() => setSearch('')}
                      className="text-sm text-pink-500 hover:text-pink-700 font-semibold"
                      style={{ fontFamily: 'Cairo' }}
                    >
                      مسح البحث ×
                    </button>
                  )}
                </div>

                {/* بطاقات المنتجات */}
                {filtered.length > 0 ? (
                  <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 animate-fade-in">
                    {filtered.map((product, idx) => {
                      const catIdx = categories.findIndex(c => c.id === product.categoryId);
                      const gradient = catGradients[catIdx % catGradients.length];
                      return (
                        <div
                          key={product.id}
                          className="bg-white rounded-2xl overflow-hidden border border-pink-100 hover:shadow-xl hover:-translate-y-0.5 transition-all group cursor-pointer"
                          onClick={() => setSelectedProduct(product)}
                        >
                          {/* صورة المنتج */}
                          <div
                            className="h-40 flex items-center justify-center relative overflow-hidden"
                            style={{ background: gradient }}
                          >
                            <span className="text-7xl group-hover:scale-110 transition-transform duration-300">
                              {product.emoji}
                            </span>
                            <span
                              className="absolute top-2 right-2 text-xs px-2 py-1 rounded-full font-bold"
                              style={{ background: 'rgba(255,255,255,0.85)', color: '#E75480', fontFamily: 'Cairo' }}
                            >
                              {product.categoryIcon} {product.categoryName}
                            </span>
                          </div>

                          {/* بيانات المنتج */}
                          <div className="p-4">
                            <h3 className="font-black text-gray-800 mb-1 leading-snug" style={{ fontFamily: 'Cairo', fontSize: 14 }}>
                              {product.name}
                            </h3>
                            <div className="flex items-center justify-between mt-2">
                              <span className="text-xl font-black" style={{ color: '#E75480', fontFamily: 'Cairo' }}>
                                {product.price}
                                <span className="text-xs font-normal text-gray-500 mr-1">د.ج</span>
                              </span>
                              <button
                                onClick={e => { e.stopPropagation(); navigate('order'); }}
                                className="flex items-center gap-1 px-3 py-1.5 rounded-full text-white text-xs font-bold shadow hover:shadow-md transition-all hover:scale-105"
                                style={{ background: 'linear-gradient(135deg, #E75480, #D4AF37)', fontFamily: 'Cairo' }}
                              >
                                <span>+</span> أضف
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="bg-white rounded-3xl p-16 text-center border border-pink-100 animate-fade-in">
                    <div className="text-6xl mb-4">🔍</div>
                    <h3 className="text-xl font-bold text-gray-800 mb-2" style={{ fontFamily: 'Cairo' }}>لا توجد نتائج</h3>
                    <p className="text-gray-500 mb-5" style={{ fontFamily: 'Tajawal' }}>جرّب تغيير التصنيف أو كلمة البحث</p>
                    <button
                      onClick={() => { setSearch(''); setActiveCat('all'); }}
                      className="px-6 py-2.5 rounded-full text-white font-bold"
                      style={{ background: 'linear-gradient(135deg, #E75480, #D4AF37)', fontFamily: 'Cairo' }}
                    >
                      عرض الكل
                    </button>
                  </div>
                )}

                {/* CTA  */}
                <div
                  className="mt-10 rounded-3xl p-8 text-center relative overflow-hidden"
                  style={{ background: 'linear-gradient(135deg, #E75480 0%, #D4AF37 100%)' }}
                >
                  <div className="absolute -top-8 -right-8 w-32 h-32 rounded-full bg-white/10"></div>
                  <div className="absolute -bottom-8 -left-8 w-40 h-40 rounded-full bg-white/10"></div>
                  <div className="relative">
                    <div className="text-4xl mb-3">🎁</div>
                    <h3 className="text-xl font-black text-white mb-2" style={{ fontFamily: 'Cairo' }}>جاهز تختار بوكسك؟</h3>
                    <p className="text-white/90 text-sm mb-4" style={{ fontFamily: 'Tajawal' }}>
                      أضف المنتجات التي تعجبك وأنشئ بوكس هدية مميز
                    </p>
                    <button
                      onClick={() => navigate('order')}
                      className="px-8 py-3 rounded-full bg-white font-bold text-pink-600 shadow-xl hover:scale-105 transition-transform"
                      style={{ fontFamily: 'Cairo' }}
                    >
                      اطلب بوكسك الآن ←
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Modal تفاصيل المنتج */}
          {selectedProduct && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4"
              style={{ background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)' }}
              onClick={() => setSelectedProduct(null)}
            >
              <div
                className="bg-white rounded-3xl overflow-hidden w-full max-w-sm shadow-2xl animate-slide-up"
                onClick={e => e.stopPropagation()}
              >
                {/* رأس الكارت */}
                {(() => {
                  const catIdx = categories.findIndex(c => c.id === selectedProduct.categoryId);
                  return (
                    <div
                      className="h-52 flex items-center justify-center relative"
                      style={{ background: catGradients[catIdx % catGradients.length] }}
                    >
                      <span className="text-8xl">{selectedProduct.emoji}</span>
                      <button
                        onClick={() => setSelectedProduct(null)}
                        className="absolute top-3 left-3 w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-gray-600 hover:bg-white transition-colors text-xl"
                      >×</button>
                    </div>
                  );
                })()}
                <div className="p-6">
                  <div className="text-xs text-pink-500 font-bold mb-1" style={{ fontFamily: 'Cairo' }}>
                    {selectedProduct.categoryIcon} {selectedProduct.categoryName}
                  </div>
                  <h3 className="text-xl font-black text-gray-800 mb-3" style={{ fontFamily: 'Cairo' }}>
                    {selectedProduct.name}
                  </h3>
                  <div className="text-3xl font-black mb-5" style={{ color: '#E75480', fontFamily: 'Cairo' }}>
                    {selectedProduct.price}
                    <span className="text-base font-normal text-gray-400 mr-1">د.ج</span>
                  </div>
                  <div className="flex gap-3">
                    <button
                      onClick={() => { setSelectedProduct(null); navigate('order'); }}
                      className="flex-1 py-3 rounded-xl text-white font-bold shadow-lg hover:shadow-xl transition-all hover:scale-[1.02]"
                      style={{ background: 'linear-gradient(135deg, #E75480, #D4AF37)', fontFamily: 'Cairo' }}
                    >
                      🎁 أضف للبوكس
                    </button>
                    <button
                      onClick={() => sendWhatsApp(`مرحباً Anne Cup Box 💕\nأرغب في الاستفسار عن:\n${selectedProduct.emoji} ${selectedProduct.name}\nالسعر: ${selectedProduct.price} د.ج`)}
                      className="flex-1 py-3 rounded-xl text-white font-bold shadow-lg hover:shadow-xl transition-all hover:scale-[1.02]"
                      style={{ background: 'linear-gradient(135deg, #25D366, #128C7E)', fontFamily: 'Cairo' }}
                    >
                      💬 استفسر
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================
    // التطبيق الرئيسي
    // =========================================================
    const App = () => {
      const [route, setRoute] = useState(() => {
        const saved = localStorage.getItem('anne_route_v2');
        return saved || 'home';
      });

      useEffect(() => {
        localStorage.setItem('anne_route_v2', route);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [route]);

      const navigate = (r) => setRoute(r);

      return (
        <div className="min-h-screen" style={{ background: '#FFFCFB', fontFamily: 'Tajawal, sans-serif' }}>
          <Header route={route} navigate={navigate} />

          <main className="pb-10">
            {route === 'home'     && <HomePage navigate={navigate} />}
            {route === 'products' && <ProductsPage navigate={navigate} />}
            {route === 'order'    && <OrderPage navigate={navigate} />}
            {route === 'gallery'  && <GalleryPage />}
            {route === 'contact'  && <ContactPage />}
          </main>

          <Footer navigate={navigate} />
          <WhatsAppFloat />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
